name: Public-surface hygiene

# Agent operating instructions are maintainer-local in this public reference
# repository. Root role guides and runtime pointers are rejected by filename;
# the adopter model and methodology-facing product content remain public.
# The guard is unconditional and does not depend on content classification.
#
# In addition, a full-tree content scan of committed agent-document paths runs
# against an internal-ops marker regex (private-repo refs, agent-role/roster
# names, containment vocabulary), so if one of these files is ever edited to
# include real internal-ops content later, CI catches it. Full-tree (not
# diff-only) so a pre-existing file that later gains internal content is
# still caught even if the triggering PR doesn't touch it directly.
#
# The marker regex is read from the HYGIENE_INTERNAL_MARKERS repository
# secret so the patterns never appear in this workflow file, the git
# history, or the Actions logs. Matches case-insensitively. Generic error
# message only - never echoes the matched line or the marker regex, only the
# file path.
#
# Skips cleanly (safe no-op) when the secret is unavailable (e.g. not yet
# configured, or a fork PR) so the check does not fail the build before the
# secret is set.
#
# Runs on push to main as well as on pull requests, so a direct push bypasses
# nothing the PR path would have caught. On a push event the diff range is
# github.event.before..github.event.after rather than the PR's base/head.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  hub-pointer-scan:
    runs-on: ubuntu-latest
    name: Hub-pointer scan (diff + full tree)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan tracked files and the PR diff
        env:
          HUB: ${{ secrets.HYGIENE_HUB_SLUG }}
          BASE_SHA: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event_name == 'push' && github.event.after || github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # A public repository never points at the private hub. The slug lives
          # only in the secret, so this file does not name it and its own diff
          # cannot trip the scan. Matched text is never printed - path only.
          #
          # Two passes, because they catch different things: the diff pass fails
          # the change under review, and the full-tree pass catches whatever
          # landed before this guard existed, which the diff can never see.
          # Also matches an unpunctuated variant of the cross-ref form, kept
          # in its own variable so it can be self-tested deterministically.
          CROSSREF='strategy#[0-9]|strategy[[:space:]]+(task|epic|issue)s?[[:space:]]*#?[0-9]+'

          if [ -z "${HUB:-}" ]; then
            echo "slug not configured; scanning the cross-ref form only."
            PATTERN="$CROSSREF"
          else
            PATTERN="${HUB}|${CROSSREF}"
          fi

          fail=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            case "$f" in .github/workflows/public-surface-hygiene.yml) continue ;; esac
            if grep -Iqi -E "$PATTERN" "$f" 2>/dev/null; then
              echo "::error file=$f::Private-hub pointer in a tracked file. Reference the hub as HUB-<number>."
              fail=1
            fi
          done < <(git ls-files)

          if [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ]; then
            if git diff "$BASE_SHA" "$HEAD_SHA" -- . ':(exclude).github/workflows/public-surface-hygiene.yml' \
                 | grep -E '^\+[^+]' | grep -Eqi "$PATTERN"; then
              echo "::error::Private-hub pointer in an added diff line."
              fail=1
            fi

            # Commit messages are scanned too: a message is written once,
            # lands in the default branch, and no later pass over files or
            # diff lines can see it. Only BASE_SHA..HEAD_SHA is read, so
            # existing history is not re-litigated on every run.
            if git log --format=%B "$BASE_SHA..$HEAD_SHA" 2>/dev/null | grep -Eqi "$PATTERN"; then
              echo "::error::Private-hub pointer in a commit message."
              fail=1
            fi
          fi

          if [ "$fail" -ne 0 ]; then
            echo "::error::public-surface-hygiene: hub-pointer scan failed. Matched terms are deliberately not printed."
            exit 1
          fi
          echo "public-surface-hygiene: hub-pointer scan clean."

      - name: Self-test - cross-reference guard
        shell: bash
        run: |
          set -euo pipefail

          # Exercises the actual live pattern from the step above (extracted
          # from this file) so a future edit can't silently narrow or broaden
          # the guard without CI catching it.
          CROSSREF="$(grep -E "^[[:space:]]*CROSSREF='" .github/workflows/public-surface-hygiene.yml \
            | sed -E "s/^[[:space:]]*CROSSREF='(.*)'\$/\1/")"
          [ -n "$CROSSREF" ] || { echo "::error::could not extract the guard pattern from the workflow file for self-test"; exit 1; }

          fail=0
          check() {
            local expect="$1" input="$2" got=no-match
            printf '%s\n' "$input" | grep -qiE "$CROSSREF" && got=match
            if [ "$got" != "$expect" ]; then
              echo "::error::self-test failed for '$input' - expected $expect, got $got"
              fail=1
            fi
          }

          # Positive - must be flagged.
          check match "strategy#217"
          check match "strategy task 217"
          check match "strategy issue 217"
          check match "strategy epic 391"

          # Negative - must NOT be flagged.
          check no-match "task 3 of the pipeline"
          check no-match "closes #12"
          check no-match "our strategy session"

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "OK - cross-reference guard self-test passed (4 positive, 3 negative)."

  check-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject public root agent instructions
        shell: bash
        run: |
          set -euo pipefail

          if git ls-files | grep -qiE '^(AGENTS|ANALYST|CLAUDE|FINDINGS|INGEST|MODELER|VALIDATOR)\.md$|^\.github/copilot-instructions\.md$'; then
            echo "::error::agent operating instructions are maintainer-local and must not be committed on this public repository"
            exit 1
          fi
          echo "OK - no public root agent instructions."


      - name: Scan public agent-docs for internal-ops markers
        shell: bash
        env:
          MARKERS: ${{ secrets.HYGIENE_INTERNAL_MARKERS }}
        run: |
          set -euo pipefail

          if [ -z "${MARKERS:-}" ]; then
            echo "HYGIENE_INTERNAL_MARKERS secret not available (unset, or a fork PR) - skipping."
            exit 0
          fi

          fail=0

          while IFS= read -r f; do
            if grep -qiE "$MARKERS" "$f"; then
              echo "::error file=$f::internal-ops content in a public agent-doc"
              fail=1
            fi
          done < <(git ls-files | grep -iE '(^|/)(CLAUDE|AGENTS)\.md$')

          if [ "${fail:-0}" = "1" ]; then
            echo "Neutralize the matched content and re-push. The matched terms are deliberately not printed; refer to the file path above."
            exit 1
          fi
          echo "OK - no internal-ops markers found in tracked CLAUDE.md / AGENTS.md files."
