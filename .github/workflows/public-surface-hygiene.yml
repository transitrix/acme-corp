name: Public-surface hygiene

# acme-corp is a demo/reference adopter repo and legitimately SHIPS its own
# CLAUDE.md / AGENTS.md publicly (adopter demo content) - unlike most repos in
# this family, it does NOT get a filename-ban or gitignore treatment for
# these files.
#
# Instead: a full-tree content scan of every committed CLAUDE.md / AGENTS.md
# against an internal-ops marker regex (private-repo refs, agent-role/roster
# names, containment vocabulary), so if one of these files is ever edited to
# include real internal-ops content later, CI catches it. Full-tree (not
# diff-only) so a pre-existing file that later gains internal content is
# still caught even if the triggering PR doesn't touch it directly.
#
# The marker regex is read from the HYGIENE_INTERNAL_MARKERS repository
# secret so the patterns never appear in this workflow file, the git
# history, or the Actions logs. Matches case-insensitively. Generic error
# message only - never echoes the matched line or the marker regex, only the
# file path.
#
# Skips cleanly (safe no-op) when the secret is unavailable (e.g. not yet
# configured, or a fork PR) so the check does not fail the build before the
# secret is set.

on:
  pull_request:

jobs:
  hub-pointer-scan:
    runs-on: ubuntu-latest
    name: Hub-pointer scan (diff + full tree)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan tracked files and the PR diff
        env:
          HUB: ${{ secrets.HYGIENE_HUB_SLUG }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # A public repository never points at the private hub. The slug lives
          # only in the secret, so this file does not name it and its own diff
          # cannot trip the scan. Matched text is never printed - path only.
          #
          # Two passes, because they catch different things: the diff pass fails
          # the change under review, and the full-tree pass catches whatever
          # landed before this guard existed, which the diff can never see.
          if [ -z "${HUB:-}" ]; then
            echo "slug not configured; scanning the cross-ref form only."
            PATTERN='strategy#[0-9]'
          else
            PATTERN="${HUB}|strategy#[0-9]"
          fi

          fail=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            case "$f" in .github/workflows/public-surface-hygiene.yml) continue ;; esac
            if grep -Iqi -E "$PATTERN" "$f" 2>/dev/null; then
              echo "::error file=$f::Private-hub pointer in a tracked file. Committed content carries no hub pointer and no work-item reference."
              fail=1
            fi
          done < <(git ls-files)

          if [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ]; then
            if git diff "$BASE_SHA" "$HEAD_SHA" -- . ':(exclude).github/workflows/public-surface-hygiene.yml' \
                 | grep -E '^\+[^+]' | grep -Eqi "$PATTERN"; then
              echo "::error::Private-hub pointer in an added diff line."
              fail=1
            fi

            # Commit-message pass. A message lands in the default branch and no
            # pass over files or PR metadata can reach it afterwards. Only
            # BASE..HEAD is read, so a change is judged on what it adds.
            if git log --format=%B "$BASE_SHA..$HEAD_SHA" 2>/dev/null | grep -Eqi "$PATTERN"; then
              echo "::error::Private-hub pointer in a commit message."
              fail=1
            fi
          fi

          if [ "$fail" -ne 0 ]; then
            echo "::error::public-surface-hygiene: hub-pointer scan failed. Matched terms are deliberately not printed."
            exit 1
          fi
          echo "public-surface-hygiene: hub-pointer scan clean."

      - name: Work-item references
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # A work-item reference does not go on a public surface: not in
          # committed content, not in a PR title, not in a PR body, not in a
          # commit message. It lives in the hub issue, which already links to the
          # pull request.
          #
          # Two operative reasons, both about how the text reads later:
          #
          # - A number is not a reason. What a line needs is why it is the way it
          #   is, and the durable form for that is a decision cited by name and
          #   date - resolvable by any reader, and stable when a work item is
          #   renumbered or closed.
          # - PR metadata is committed content with a delay. This repository
          #   squashes with COMMIT_OR_PR_TITLE and merges with PR_TITLE, so a PR
          #   title becomes a commit subject on the default branch. Commit
          #   messages are read for the same reason, over BASE..HEAD only.
          #
          # A reference to this repository's own issue or PR is untouched: a
          # plain hash-number, and the `closes` / `fixes` auto-close keywords,
          # mean what they say. Only work-item forms match: the `HUB-` prefix, or
          # a hash-number dressed as task / epic / hub work. The bare
          # hash-number is the worst form - it auto-links to the item of that
          # number in THIS repository, so it renders as a working link to
          # something unrelated.
          #
          # These patterns name nothing confidential, so the matched token is
          # printed - a contributor has to be able to see what tripped. This file
          # is excluded from its own scan, which doubles as the escape hatch for
          # a doc that must legitimately show the form.
          WORKITEM='(\bHUB-[0-9]+|\b(task|epic|hub)s?[[:space:]:]+#[0-9]+)'
          SELF='.github/workflows/public-surface-hygiene.yml'

          fail=0
          tmp="$(mktemp -d)"

          # report <pattern> <label> <file> <annotation-or-empty> <advice>
          report() {
            local pat="$1" label="$2" target="$3" anno="$4" advice="$5" hits tag
            hits="$(grep -oIiE "$pat" "$target" 2>/dev/null | sort -u | tr '\n' ' ' || true)"
            [ -n "$hits" ] || return 1
            if [ -n "$anno" ]; then tag="::error ${anno}::"; else tag="::error::"; fi
            echo "${tag}work-item reference in the ${label} ( ${hits}) - ${advice}"
            return 0
          }

          ADVICE="a work-item reference does not go on a public surface - keep the reason and drop the number, cite the decision by name and date, and leave the work-item trail in the hub issue"

          # 1) Full tree.
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            [ "$f" = "$SELF" ] && continue
            if report "$WORKITEM" tree "$f" "file=$f" "$ADVICE"; then fail=1; fi
          done < <(git ls-files)

          # 2) Added diff lines, when there is a pull request to diff.
          if [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ]; then
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              [ -f "$f" ] || continue
              [ "$f" = "$SELF" ] && continue
              git diff "$BASE_SHA" "$HEAD_SHA" -- "$f" | grep -E '^\+[^+]' > "$tmp/added" || true
              [ -s "$tmp/added" ] || continue
              if report "$WORKITEM" diff "$tmp/added" "file=$f" "$ADVICE"; then fail=1; fi
            done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || true)
          else
            echo "no pull-request context - scanning the tree only."
          fi

          # 3) PR title/body. The title becomes a commit subject on merge, so it
          # is committed content with a delay.
          printf '%s' "${PR_TITLE:-}" > "$tmp/title"
          printf '%s' "${PR_BODY:-}" > "$tmp/body"
          if report "$WORKITEM" title "$tmp/title" "" "$ADVICE"; then fail=1; fi
          if report "$WORKITEM" body "$tmp/body" "" "$ADVICE"; then fail=1; fi

          # 4) This change's own commit messages.
          if [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ]; then
            git log --format=%B "$BASE_SHA..$HEAD_SHA" > "$tmp/messages" 2>/dev/null || true
            if [ -s "$tmp/messages" ]; then
              if report "$WORKITEM" "commit message" "$tmp/messages" "" "$ADVICE"; then fail=1; fi
            fi
          fi

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "OK - no work-item references on any scanned surface."

  check-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan public agent-docs for internal-ops markers
        shell: bash
        env:
          MARKERS: ${{ secrets.HYGIENE_INTERNAL_MARKERS }}
        run: |
          set -euo pipefail

          if [ -z "${MARKERS:-}" ]; then
            echo "HYGIENE_INTERNAL_MARKERS secret not available (unset, or a fork PR) - skipping."
            exit 0
          fi

          fail=0

          while IFS= read -r f; do
            if grep -qiE "$MARKERS" "$f"; then
              echo "::error file=$f::internal-ops content in a public agent-doc"
              fail=1
            fi
          done < <(git ls-files | grep -iE '(^|/)(CLAUDE|AGENTS)\.md$')

          if [ "${fail:-0}" = "1" ]; then
            echo "Neutralize the matched content and re-push. The matched terms are deliberately not printed; refer to the file path above."
            exit 1
          fi
          echo "OK - no internal-ops markers found in tracked CLAUDE.md / AGENTS.md files."
