# Worked example — PRODUCT element primitive.
# Schema: notations/ELEMENT_PRIMITIVES.md §7.6 + envelope §3.
# The mobile shopping channel. Shares the customer record with the storefront,
# which is why it carries its own erasure assertion (ASSERTION-MOBILE-DATA-ERASURE-1).

notation: product
id: PRODUCT-MOBILE-1
name: "Mobile Shopping App"
type: digital_product                   # digital_product | service | platform | bundle
domain: "Digital"
owner_role: ROLE-PROD-1
maturity: 2
description: >
  iOS and Android shopping application. Reads and writes the same customer
  record as the storefront; personal data captured in-app is subject to the
  same erasure and consent obligations.
capabilities:
  - CAPABILITY-V2
processes:
  - PROCESS-DSR-HANDLE-1
supporting_apps:
  - APPLICATION-CRM-1

