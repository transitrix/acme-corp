# Worked example — HAZARD element primitive.
# Schema: notations/elements/28-hazard-risk-control.md §2 + envelope §3.
#
# DELIBERATE GAP: no RISK_CONTROL mitigates this hazard yet, so the
# cross-cutting rule HAZ-RISKCTL-COVERAGE-001 fires on it. The gap is real —
# carrier data minimisation is on the remediation backlog, not implemented.

notation: hazard
id: HAZARD-CARRIER-PII-EXPOSURE-1
name: "Excess personal data disclosed to the carrier at handover"
description: >
  The shipping label produced at STEP-ORD-FULFILL-5 carries the full customer
  record fields available in the OMS rather than the minimum set the carrier
  needs to deliver. The hazardous situation arises on every shipment: personal
  data leaves Acme's control into a third-party processor's systems, in a
  volume not justified by the delivery purpose.
harm: >
  Unnecessary exposure of personal data to a third party, contrary to the
  data-minimisation principle; the exposure compounds if the carrier suffers
  a breach, since the leaked record is richer than it needed to be.

severity: minor
probability: frequent
initial_risk: alarp

