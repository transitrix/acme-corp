# Worked example — HAZARD element primitive.
# Schema: notations/elements/28-hazard-risk-control.md §2 + envelope §3.
# ISO 14971's risk vocabulary applied to a privacy hazard: the source of harm
# is a data-protection failure, the harm lands on the data subject.

notation: hazard
id: HAZARD-ARCHIVE-RETENTION-1
name: "Personal data survives an erasure request in the cold-storage archive"
description: >
  The order-history archive (7-year fiscal retention, cold storage) is written
  at order close-out and is not reached by the erasure pipeline. A verified
  erasure request therefore clears the active systems while leaving a full
  copy of the subject's personal data in the archive — the hazardous situation
  arises whenever an erasure request is honoured for a customer whose orders
  have already been archived.
harm: >
  The data subject's Art. 17 right is not fulfilled: personal data continues
  to be processed after erasure was granted, without the subject's knowledge.
  Regulatory exposure under Art. 83, plus loss of trust if surfaced publicly.

severity: serious            # negligible | minor | serious | critical | catastrophic
probability: occasional      # frequent | probable | occasional | remote | improbable
initial_risk: unacceptable   # acceptable | alarp | unacceptable

