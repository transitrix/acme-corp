# Worked example — TARGET_STATE element primitive (ArchiMate Plateau, baseline).
# Schema: notations/ELEMENT_PRIMITIVES.md §7.17 + envelope §3.
# The baseline plateau — today, not a destination (type: base). Captures the
# live CAPABILITY / PROCESS / APPLICATION composition as it stands right now,
# distinct from TARGET_STATE-EU-LIVE-1 (a future end-state). Per
# ELEMENT_PRIMITIVES.md §7.17, a baseline plateau lets impact/blast-radius
# analysis trace an operational element (APPLICATION / PROCESS / CAPABILITY)
# up through this composition to the standing goals it satisfies right now —
# reusing target_state_satisfies_goal rather than a new relation kind bridging
# operational elements directly to GOAL.
# Worked example REL file: canon/relations/REL-TS-BASE-GOAL-REVENUE-1.yaml.

notation: target-state
id: TARGET_STATE-BASE-1
name: "Current operations — order management, fulfilment, and CRM live"
type: base
description: >
  The structural snapshot of Acme's live operations today: order intake,
  fulfilment, customer onboarding, support resolution, strategy planning,
  and data-subject-request handling running on the current CRM and OMS
  applications. At most one `base` plateau is in effect at a time.
capabilities:
  - CAPABILITY-V1
  - CAPABILITY-V1.1
  - CAPABILITY-V1.2
  - CAPABILITY-V2
processes:
  - PROCESS-ORD-FULFILL-1
  - PROCESS-CUST-ONBOARD-1
  - PROCESS-CS-RESOLVE-1
  - PROCESS-STRAT-PLAN-1
  - PROCESS-DSR-HANDLE-1
applications:
  - APPLICATION-OMS-1
  - APPLICATION-CRM-1

