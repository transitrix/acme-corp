# The passing counterpart to VERIFICATION-ARCHIVE-PURGE-TEST-1 — same spine,
# a requirement whose V&V chain closes.

notation: verification
id: VERIFICATION-PORTABILITY-EXPORT-TEST-1
verifies: REQUIREMENT-GDPR-PORTABILITY-1
method: test
protocol: >
  For 15 synthetic accounts of varying order history, request the self-service
  export from account settings and inspect the delivered archive. Acceptance
  criteria: export delivered within the 30-day statutory deadline; contents
  cover order history, profile and consent records; both JSON and CSV parse
  against their published schemas.
result: >
  15/15 exports delivered within 72 hours (median 4 minutes for accounts under
  200 orders). Schema validation passed for both formats on all runs; consent
  records present and complete in every export.
outcome: pass

evidence:
