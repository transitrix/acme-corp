# PRINCIPLE-specific frontmatter (14-codex.md §4.1)
statement: "The organisation uses customer order and support data only for the purpose it was collected, and does not repurpose it for marketing profiling without the customer's separate, explicit opt-in."
rationale: >
  Customer trust in the ordering and support experience is core to retention.
  The organisation holds itself to using customer data only for the purpose
  it was given, independent of what any specific regulation strictly
  requires. No named enforcer and no stated pass/fail conformance test check
  this beyond the organisation's own judgement — the discriminator that
  makes it a PRINCIPLE rather than a POLICY or an INTERNAL_STANDARD
  (14-codex.md §2.1).

