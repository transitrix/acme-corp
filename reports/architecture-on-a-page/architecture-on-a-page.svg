<text x="30" y="788" font-size="7.6" font-family="Arial, sans-serif" font-weight="normal" fill="#3b3b3b">Assembly method: hand-assembled per @transitrix/document-view-engine’s current limit (renders only the "blocks" notation inline; every other notation resolves as a missing illustration — see reports/architecture-on-a-page/README.md). The Standards-cell technology-blocks panel is</text><text x="30" y="799" font-size="7.6" font-family="Arial, sans-serif" font-weight="normal" fill="#3b3b3b">generated directly by renderBlocksSvg() from this repo’s BLOCKS-PERSONAL-DATA-1; every other cell is hand-transcribed text drawn from the cited view-configs and canon elements, and re-verified against the source files it cites, not invented.</text><text x="30" y="811" font-size="7.6" font-family="Arial, sans-serif" font-weight="normal" fill="#3b3b3b">Page box declared 420×297mm (1191×842pt) via the root &lt;svg&gt; width/height — verified on this produced file, not the generator.</text>
