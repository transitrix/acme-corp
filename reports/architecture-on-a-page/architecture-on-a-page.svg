<text x="416.3333333333333" y="146" font-size="8.5" font-family="Arial, sans-serif" font-weight="bold" fill="#1a1a1a">Capability Map (CAPABILITY_MAP-COMPLIANCE-1):</text><text x="422.3333333333333" y="159.9" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">V1 Order Management — maturity 2→3 (V1.1 Order Intake 3→3, V1.2 Order</text><text x="422.3333333333333" y="172.3" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">Fulfilment 2→3)</text><text x="422.3333333333333" y="185.70000000000002" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">V2 Customer Relationship Management — maturity 2→3</text><text x="422.3333333333333" y="199.10000000000002" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">H1 Compliance &amp; Data Protection — cross-cutting, maturity 1→3 (lowest</text><text x="422.3333333333333" y="211.50000000000003" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">score)</text><text x="416.3333333333333" y="226.90000000000003" font-size="8.5" font-family="Arial, sans-serif" font-weight="bold" fill="#1a1a1a">TARGET_STATE: 2</text><text x="422.3333333333333" y="240.80000000000004" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">TARGET_STATE-BASE-1 "Current operations — order management, fulfilment, and</text><text x="422.3333333333333" y="253.20000000000005" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">CRM live" (baseline)</text><text x="422.3333333333333" y="266.6" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">TARGET_STATE-EU-LIVE-1 "EU operations live — three markets, localised CRM</text><text x="422.3333333333333" y="279" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">and payments"</text><text x="416.3333333333333" y="294.4" font-size="8.5" font-family="Arial, sans-serif" font-weight="bold" fill="#a76b00">Activity Network + MILESTONE: no dedicated activity-network view; milestones</text><text x="416.3333333333333" y="306.29999999999995" font-size="8.5" font-family="Arial, sans-serif" font-weight="bold" fill="#a76b00">carried on the Outlines-cell action card (2 milestones, see Outlines)</text><text x="416.3333333333333" y="321.19999999999993" font-size="8.5" font-family="Arial, sans-serif" font-weight="bold" fill="#1a1a1a">Process Blueprint (PROCESS_BLUEPRINT-FULFIL-1):</text><text x="422.3333333333333" y="335.0999999999999" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">5 stages — Receive order → Allocate inventory → Pick &amp; pack → Ship →</text><text x="422.3333333333333" y="347.4999999999999" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">Confirm delivery &amp; close</text><text x="422.3333333333333" y="360.89999999999986" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">Systems: OMS, CRM. Roles: Customer Support Lead, Operations Lead, Data</text><text x="422.3333333333333" y="373.29999999999984" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">Protection Officer</text>
