<text x="28" y="146" font-size="9.5" font-family="Arial, sans-serif" font-weight="bold" fill="#a76b00">POLICY (codex/internal): 0 admitted</text><text x="28" y="161.9" font-size="8.5" font-family="Arial, sans-serif" font-weight="bold" fill="#1a1a1a">DGCA drivers → goals (canon/views/dgca/,</text><text x="28" y="173.8" font-size="8.5" font-family="Arial, sans-serif" font-weight="bold" fill="#1a1a1a">canon/elements/01_motivation/{factors,goals}/):</text><text x="34" y="187.70000000000002" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">DRIVER-EU-REG-1 "EU regulatory window for market entry" (external, legal) →</text><text x="34" y="200.10000000000002" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">GOAL-EU-1 "Launch in 3 EU markets"</text><text x="34" y="214.50000000000003" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">DRIVER-COMPETITION-1 "Competitive pressure" (external, economic) →</text><text x="34" y="226.90000000000003" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">GOAL-EU-1</text><text x="34" y="241.30000000000004" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">DRIVER-COMP-1 "Support response time" (internal) → GOAL-OPS-1 "Cut support</text><text x="34" y="253.70000000000005" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">response time by half"</text>
