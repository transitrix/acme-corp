<text x="804.6666666666666" y="146" font-size="8.5" font-family="Arial, sans-serif" font-weight="bold" fill="#1a1a1a">scenarios: 1</text><text x="810.6666666666666" y="159.9" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">SCENARIO-EU-GOLIVE-1 "EU Go-Live 2026" — three EU markets live, GDPR/NIS2</text><text x="810.6666666666666" y="172.3" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">obligations fully satisfied</text><text x="804.6666666666666" y="187.70000000000002" font-size="8.5" font-family="Arial, sans-serif" font-weight="bold" fill="#1a1a1a">CHANGE: 3</text><text x="810.6666666666666" y="201.60000000000002" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">CHANGE-EU-CRM-1 "Stand up EU-localised CRM and payment processing"</text><text x="810.6666666666666" y="215.00000000000003" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">CHANGE-GDPR-COMPLIANCE-1 "Close EU data-protection compliance gaps"</text><text x="810.6666666666666" y="228.40000000000003" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">CHANGE-ONBOARD-1 "Rework the customer onboarding journey"</text><text x="804.6666666666666" y="243.80000000000004" font-size="8.5" font-family="Arial, sans-serif" font-weight="bold" fill="#1a1a1a">action-card: 1</text><text x="810.6666666666666" y="257.70000000000005" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">ACTION_CARD-GDPR-REMEDIATION-1 — GDPR remediation programme, 2026-Q2→Q4</text><text x="810.6666666666666" y="271.1" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">MILESTONE-GDPR-ERASURE-CLOSED-1 (2026-09-15) — cold-storage archive erasure</text><text x="810.6666666666666" y="283.5" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">gap closed</text><text x="810.6666666666666" y="296.9" font-siz