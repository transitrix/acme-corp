<text x="30" y="56" font-size="9.5" font-family="Arial, sans-serif" font-weight="normal" fill="#3b3b3b">Organised by Kotusev's CSVLOD taxonomy (Enterprise Architecture Artifacts on a Page, eaonapage.com) — every cell filled from acme-corp's committed canon; an empty cell is a</text><text x="30" y="68.9" font-size="9.5" font-family="Arial, sans-serif" font-weight="normal" fill="#3b3b3b">counted state, never blank paper.</text>
