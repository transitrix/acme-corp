<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 1191 842" font-family="Arial, sans-serif" role="img" aria-labelledby="page-title page-description">
<title id="page-title">Acme Corp - Enterprise Architecture on a Page</title><desc id="page-description">Manually assembled fictional model snapshot, checked 2026-10-21. Six CSVLOD reading cells; plans and modelled gaps are not completed outcomes. A3 landscape.</desc><rect x="0" y="0" width="1191" height="842" fill="#ffffff" />
<rect x="18" y="18" width="1155" height="66" fill="#f4f9fb" stroke="#3b6cb3" stroke-width="0.75" />
<text x="30" y="40" font-size="18" font-weight="bold" fill="#1a1a1a">Acme Corp — Enterprise Architecture on a Page</text>
<text x="30" y="56" font-size="9.5" font-family="Arial, sans-serif" font-weight="normal" fill="#3b3b3b">Reading frame: Svyatoslav Kotusev's CSVLOD taxonomy (v1.2, 2017). Selected model content, not a complete artefact inventory.</text><text x="30" y="68.9" font-size="9.5" font-family="Arial, sans-serif" font-weight="normal" fill="#3b3b3b">Rows: Business-Focused / IT-Focused. Columns: Rules / Structures / Changes. Zero means no modelled instance in the stated scope.</text>
<text x="1161" y="72" font-size="8" fill="#3b3b3b" text-anchor="end">Fictional worked example - checked 2026-10-21</text>
<text x="1161" y="80" font-size="8" fill="#3b3b3b" text-anchor="end">Model pin: Methodology 7.0.0</text>
<rect x="18" y="94" width="378.3333333333333" height="330" fill="#f4f9fb" stroke="#3b6cb3" stroke-width="0.75" /><rect x="18" y="94" width="378.3333333333333" height="28" fill="#ccd8dc" stroke="#3b6cb3" stroke-width="0.75" /><text x="28" y="112" font-size="13" font-weight="bold" fill="#1a1a1a">Considerations — Business-Focused Rules</text><text x="28" y="133" font-size="8" font-style="italic" fill="#4a4a4a">Business direction and organisation-held rules, read through selected model records.</text>
<text x="28" y="146" font-size="9.5" font-family="Arial, sans-serif" font-weight="bold" fill="#a76b00">POLICY (codex/internal): 0; PRINCIPLE: 1</text><text x="28" y="161.9" font-size="8.5" font-family="Arial, sans-serif" font-weight="bold" fill="#1a1a1a">Selected driver-to-goal links (canon elements):</text><text x="34" y="187.70000000000002" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">DRIVER-EU-REG-1 "EU regulatory window for market entry" (external, legal) →</text><text x="34" y="200.10000000000002" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">GOAL-EU-1 "Launch in 3 EU markets"</text><text x="34" y="214.50000000000003" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">DRIVER-COMPETITION-1 "Competitive pressure" (external, economic) →</text><text x="34" y="226.90000000000003" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">GOAL-EU-1</text><text x="34" y="241.30000000000004" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">DRIVER-COMP-1 "Support response time" (internal) → GOAL-OPS-1 "Cut support</text><text x="34" y="253.70000000000005" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">response time by half"</text>
<rect x="406.3333333333333" y="94" width="378.3333333333333" height="330" fill="#f4f9fb" stroke="#3b6cb3" stroke-width="0.75" /><rect x="406.3333333333333" y="94" width="378.3333333333333" height="28" fill="#ccd8dc" stroke="#3b6cb3" stroke-width="0.75" /><text x="416.3333333333333" y="112" font-size="13" font-weight="bold" fill="#1a1a1a">Visions — Business-Focused Structures</text><text x="416.3333333333333" y="133" font-size="8" font-style="italic" fill="#4a4a4a">Capabilities, target states and the operational value chain.</text>
<text x="416.3333333333333" y="146" font-size="8.5" font-family="Arial, sans-serif" font-weight="bold" fill="#1a1a1a">Capability Map (CAPABILITY_MAP-COMPLIANCE-1):</text><text x="422.3333333333333" y="159.9" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">V1 Order Management — maturity 3→3 (V1.1 Order Intake 3→3, V1.2 Order</text><text x="422.3333333333333" y="172.3" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">Fulfilment 2→3)</text><text x="422.3333333333333" y="185.70000000000002" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">V2 Customer Relationship Management — maturity 2→3</text><text x="422.3333333333333" y="199.10000000000002" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">H1 Compliance &amp; Data Protection — cross-cutting, maturity 1→3 (lowest</text><text x="422.3333333333333" y="211.50000000000003" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">score)</text><text x="416.3333333333333" y="226.90000000000003" font-size="8.5" font-family="Arial, sans-serif" font-weight="bold" fill="#1a1a1a">TARGET_STATE: 2</text><text x="422.3333333333333" y="240.80000000000004" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">TARGET_STATE-BASE-1 "Current operations — order management, fulfilment, and</text><text x="422.3333333333333" y="253.20000000000005" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">CRM live" (baseline)</text><text x="422.3333333333333" y="266.6" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">TARGET_STATE-EU-LIVE-1 "EU operations live — three markets, localised CRM</text><text x="422.3333333333333" y="279" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">and payments"</text><text x="416.3333333333333" y="294.4" font-size="8.5" font-family="Arial, sans-serif" font-weight="bold" fill="#a76b00">Activity Network + MILESTONE: no dedicated activity-network view; milestones</text><text x="416.3333333333333" y="306.29999999999995" font-size="8.5" font-family="Arial, sans-serif" font-weight="bold" fill="#a76b00">carried on the Outlines-cell action card (2 milestones, see Outlines)</text><text x="416.3333333333333" y="321.19999999999993" font-size="8.5" font-family="Arial, sans-serif" font-weight="bold" fill="#1a1a1a">Process Blueprint (PROCESS_BLUEPRINT-FULFIL-1):</text><text x="422.3333333333333" y="335.0999999999999" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">5 stages — Receive order → Allocate inventory → Pick &amp; pack → Ship →</text><text x="422.3333333333333" y="347.4999999999999" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">Confirm delivery &amp; close</text><text x="422.3333333333333" y="360.89999999999986" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">Systems: OMS, CRM. Roles: Customer Support Lead, Operations Lead, Data</text><text x="422.3333333333333" y="373.29999999999984" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">Protection Officer</text>
<rect x="794.6666666666666" y="94" width="378.3333333333333" height="330" fill="#f4f9fb" stroke="#3b6cb3" stroke-width="0.75" /><rect x="794.6666666666666" y="94" width="378.3333333333333" height="28" fill="#ccd8dc" stroke="#3b6cb3" stroke-width="0.75" /><text x="804.6666666666666" y="112" font-size="13" font-weight="bold" fill="#1a1a1a">Outlines — Business-Focused Changes</text><text x="804.6666666666666" y="133" font-size="8" font-style="italic" fill="#4a4a4a">A target scenario and the changes and milestones planned to reach it.</text>
<text x="804.6666666666666" y="146" font-size="8.5" font-family="Arial, sans-serif" font-weight="bold" fill="#1a1a1a">scenarios: 1</text><text x="810.6666666666666" y="159.9" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">SCENARIO-EU-GOLIVE-1 "EU Go-Live 2026" - TARGET:</text><text x="810.6666666666666" y="172.3" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">three EU markets and compliance gaps closed; not evidence of achievement.</text><text x="804.6666666666666" y="187.70000000000002" font-size="8.5" font-family="Arial, sans-serif" font-weight="bold" fill="#1a1a1a">CHANGE: 3</text><text x="810.6666666666666" y="201.60000000000002" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">CHANGE-EU-CRM-1 "Stand up EU-localised CRM and payment processing"</text><text x="810.6666666666666" y="215.00000000000003" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">CHANGE-GDPR-COMPLIANCE-1 "Close EU data-protection compliance gaps"</text><text x="810.6666666666666" y="228.40000000000003" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">CHANGE-ONBOARD-1 "Rework the customer onboarding journey"</text><text x="804.6666666666666" y="243.80000000000004" font-size="8.5" font-family="Arial, sans-serif" font-weight="bold" fill="#1a1a1a">action-card: 1</text><text x="810.6666666666666" y="257.70000000000005" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">ACTION_CARD-GDPR-REMEDIATION-1 - planned Q2-Q4 2026</text><text x="810.6666666666666" y="271.1" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">Planned 2026-09-15: MILESTONE-GDPR-ERASURE-CLOSED-1</text><text x="810.6666666666666" y="283.5" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">Cold-storage archive erasure gap closed</text><text x="810.6666666666666" y="296.9" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">Planned 2026-10-31: MILESTONE-GDPR-PREAUDIT-1</text><text x="810.6666666666666" y="309.29999999999995" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">Supervisory-authority pre-audit cleared</text>
<rect x="18" y="434" width="378.3333333333333" height="330" fill="#f4f9fb" stroke="#3b6cb3" stroke-width="0.75" /><rect x="18" y="434" width="378.3333333333333" height="28" fill="#b3c8cf" stroke="#3b6cb3" stroke-width="0.75" /><text x="28" y="452" font-size="13" font-weight="bold" fill="#1a1a1a">Standards — IT-Focused Rules</text><text x="28" y="473" font-size="8" font-style="italic" fill="#4a4a4a">Organisation-issued technical guidance; no technology pattern catalogue is claimed.</text>
<text x="28" y="486" font-size="8.5" font-family="Arial, sans-serif" font-weight="bold" fill="#1a1a1a">INTERNAL_STANDARD (codex/internal): 1</text><text x="34" y="499.9" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">INTERNAL_STANDARD-coding-conventions-1 "Engineering Coding Conventions" —</text><text x="34" y="512.3" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">issued by VP Engineering, effective 2026-01-01</text><rect x="406.3333333333333" y="434" width="378.3333333333333" height="330" fill="#f4f9fb" stroke="#3b6cb3" stroke-width="0.75" /><rect x="406.3333333333333" y="434" width="378.3333333333333" height="28" fill="#b3c8cf" stroke="#3b6cb3" stroke-width="0.75" /><text x="416.3333333333333" y="452" font-size="13" font-weight="bold" fill="#1a1a1a">Landscapes — IT-Focused Structures</text><text x="416.3333333333333" y="473" font-size="8" font-style="italic" fill="#4a4a4a">Modelled applications, their integration and the personal-data landscape.</text>
<text x="416.3333333333333" y="486" font-size="8.5" font-family="Arial, sans-serif" font-weight="bold" fill="#1a1a1a">Applications catalogue (APPLICATIONS_CAT-EU-1): 2</text><text x="422.3333333333333" y="499.9" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">APPLICATION-OMS-1 "Order Management System" — Operations, internal,</text><text x="422.3333333333333" y="512.3" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">maturity 3</text><text x="422.3333333333333" y="525.6999999999999" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">APPLICATION-CRM-1 "CRM System" — Sales, Salesforce, maturity 2</text><text x="422.3333333333333" y="539.0999999999999" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">Integration: OMS → CRM, outbound REST, propagates order and erasure events</text><text x="416.3333333333333" y="554.4999999999999" font-size="8.5" font-family="Arial, sans-serif" font-weight="bold" fill="#a76b00">integration-map: 0 (no dedicated view in this repo; the one integration above is</text><text x="416.3333333333333" y="566.3999999999999" font-size="8.5" font-family="Arial, sans-serif" font-weight="bold" fill="#a76b00">inline on the applications catalogue)</text><text x="416.3333333333333" y="581.2999999999998" font-size="8.5" font-family="Arial, sans-serif" font-weight="bold" fill="#1a1a1a">Business Objects: 1</text><text x="422.3333333333333" y="595.1999999999998" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">BUSINESS_OBJECT-CUST-ORDER-1 "Customer order" (type: record)</text>
<rect x="794.6666666666666" y="434" width="378.3333333333333" height="330" fill="#f4f9fb" stroke="#3b6cb3" stroke-width="0.75" /><rect x="794.6666666666666" y="434" width="378.3333333333333" height="28" fill="#b3c8cf" stroke="#3b6cb3" stroke-width="0.75" /><text x="804.6666666666666" y="452" font-size="13" font-weight="bold" fill="#1a1a1a">Designs — IT-Focused Changes</text><text x="804.6666666666666" y="473" font-size="8" font-style="italic" fill="#4a4a4a">Solution-level specifications; no SRS or SDD document-view instances are modelled.</text>
<text x="804.6666666666666" y="486" font-size="9.5" font-family="Arial, sans-serif" font-weight="bold" fill="#a76b00">SRS / SDD document-views: 0</text><text x="804.6666666666666" y="501.9" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">No instances in this repo. Both are defined in methodology</text><text x="804.6666666666666" y="514.3" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">(notations/views/documents/30-srs.md, 31-sdd.md) but not yet modelled here —</text><text x="804.6666666666666" y="526.6999999999999" font-size="9" font-family="Arial, sans-serif" font-weight="normal" fill="#1a1a1a">a counted zero, not a missing primitive.</text>
<rect x="18" y="774" width="1155" height="50" fill="#f4f9fb" stroke="#3b6cb3" stroke-width="0.75" />
<text x="30" y="788" font-size="7.6" font-family="Arial, sans-serif" font-weight="normal" fill="#3b3b3b">Assembly: existing renderBlocksSvg() output plus manually transcribed, source-checked text. No composition CLI or automatic refresh is supplied.</text><text x="30" y="799" font-size="7.6" font-family="Arial, sans-serif" font-weight="normal" fill="#3b3b3b">Source: github.com/transitrix/acme-corp, reports/architecture-on-a-page/README.md. Model revision and reference links are recorded there.</text><text x="30" y="811" font-size="7.6" font-family="Arial, sans-serif" font-weight="normal" fill="#3b3b3b">A3 landscape: 420 x 297 mm. Maturity values resolved from versioned sidecars at 2026-10-21; arrows show current-to-target, not measured progress.</text>
<text x="28" y="284" font-size="8.5" fill="#1a1a1a" font-weight="bold">PRINCIPLE-customer-data-purpose-limitation-1</text><text x="34" y="298" font-size="9" fill="#1a1a1a">"Customer Data Purpose Limitation" - held by the organisation.</text><text x="34" y="312" font-size="9" fill="#1a1a1a">Order and support data stay within their collected purpose;</text><text x="34" y="326" font-size="9" fill="#1a1a1a">marketing profiling requires separate explicit opt-in.</text><text x="28" y="352" font-size="8.5" fill="#1a1a1a">Principles belong in Considerations; this is not a policy count.</text><text x="28" y="530" font-size="9" fill="#1a1a1a">POLICY and INTERNAL_STANDARD counts are selected by TYPE</text><text x="28" y="544" font-size="9" fill="#1a1a1a">under codex/internal/; PRINCIPLE is counted separately.</text><text x="28" y="570" font-size="9" fill="#1a1a1a">No NODE or TECHNOLOGY_SERVICE primitives: 0 of each.</text><text x="28" y="584" font-size="9" fill="#1a1a1a">No Patterns catalogue or logical data model is represented.</text><text x="28" y="612" font-size="9" fill="#1a1a1a">The personal-data blocks panel is in Landscapes: it describes</text><text x="28" y="626" font-size="9" fill="#1a1a1a">systems and stores, not an organisation-issued standard.</text><text x="416.3333333333333" y="620" font-size="8.5" fill="#1a1a1a" font-weight="bold">BLOCKS-PERSONAL-DATA-1 - existing rendered model view:</text><g transform="translate(416.3333333333333, 638) scale(0.31432748538011696)">
<rect x="4" y="4" width="651" height="154" fill="#f5f5f5" stroke="#333333" stroke-width="1" /><text x="329.5" y="21" font-size="12" font-family="sans-serif" text-anchor="middle">Active systems (erasure-reachable, in 30-day window)</text><rect x="18" y="44" width="287" height="100" fill="#f5f5f5" stroke="#333333" stroke-width="1" /><text x="161.5" y="61" font-size="12" font-family="sans-serif" text-anchor="middle">Order Management System</text><rect x="32" y="84" width="119" height="46" fill="#ffffff" stroke="#333333" stroke-width="1" /><text x="91.5" y="111" font-size="12" font-family="sans-serif" text-anchor="middle">Active orders</text><rect x="165" y="84" width="126" height="46" fill="#ffffff" stroke="#333333" stroke-width="1" /><text x="228" y="111" font-size="12" font-family="sans-serif" text-anchor="middle">Payment tokens</text><rect x="319" y="44" width="322" height="100" fill="#f5f5f5" stroke="#333333" stroke-width="1" /><text x="480" y="61" font-size="12" font-family="sans-serif" text-anchor="middle">CRM System</text><rect x="333" y="84" width="147" height="46" fill="#ffffff" stroke="#333333" stroke-width="1" /><text x="406.5" y="111" font-size="12" font-family="sans-serif" text-anchor="middle">Customer contacts</text><rect x="494" y="84" width="133" height="46" fill="#ffffff" stroke="#333333" stroke-width="1" /><text x="560.5" y="111" font-size="12" font-family="sans-serif" text-anchor="middle">Consent records</text><rect x="669" y="4" width="467" height="154" fill="#f5f5f5" stroke="#333333" stroke-width="1" /><text x="902.5" y="21" font-size="12" font-family="sans-serif" text-anchor="middle">Cold storage (7-year fiscal retention — KNOWN ERASURE GAP)</text><rect x="683" y="44" width="439" height="100" fill="#f5f5f5" stroke="#333333" stroke-width="1" /><text x="902.5" y="61" font-size="12" font-family="sans-serif" text-anchor="middle">Order history archive</text><rect x="697" y="84" width="287" height="46" fill="#ffffff" stroke="#333333" stroke-width="1" /><text x="840.5" y="111" font-size="12" font-family="sans-serif" text-anchor="middle">Personal data (not erasure-reachable)</text><rect x="998" y="84" width="110" height="46" fill="#ffffff" stroke="#333333" stroke-width="1" /><text x="1053" y="111" font-size="12" font-family="sans-serif" text-anchor="middle">Invoices</text>
</g>
</svg>
